# SignalGraph — central configuration hub
# Every tunable parameter lives here so runs are re-runnable and reproducible.
# Paths are resolved relative to the repository root.

# ---- global ----
seed: 42                      # master RNG seed for all deterministic generation
run_id: ""                    # empty -> auto-generated "{date}T{time}-{seed}" at build time
verbose: true

# ---- data ----
data:
  mode: synthetic             # default demo; historical/edgar initial builds use config/research.yaml
  num_companies: 12           # companies in the seed graph (synthetic mode)
  num_players_per_company: 7  # insider, analyst, competitor, supplier, regulator, journalist, fund
  price_history_len: 120      # synthetic daily prices per company
  filings_per_company: 6      # synthetic filings (10-K / 8-K) per company
  news_per_company: 8         # synthetic news/transcript snippets per company
  signal_outcome_agree: 0.75  # P(costly transmitted signal agrees with latent outcome direction)
  outcome_drift: 0.01         # per-day post-brief_day drift in the latent outcome direction
  edgar:
    user_agent: ""            # required by SEC; fill with "Name contact@example.com"
    rate_limit_s: 0.1         # SEC requires >= 100ms between requests
    submissions_url: "https://www.sec.gov/files/company_tickers.json"
  ingest:                     # incremental event ingestion (graph/update.py, data/ingest.py)
    enabled: true
    sources: [feed, news]     # feed/news = offline deterministic; edgar = live SEC (needs user_agent)
    cursor_path: "results/ingest/cursor.json"   # per-source watermark of how far ingestion has advanced
    feed_events_per_poll: 3   # signals+events emitted per ingest poll, per source
    feed_start_day: 70        # first feed timestamp (>= evaluation.brief_day keeps no-lookahead)
    feed_step_days: 5         # day spacing between feed events

# ---- graph ----
graph:
  storage: json                # json (networkx serialized, deterministic) | neo4j (live DB)
  path: "results/graph/graph.json"   # serialized graph snapshot (always written; neo4j is the live copy)
  ontology_version: "1.0"
  neo4j:                       # used when graph.storage == neo4j (graph/neo4j_backend.py)
    uri: "bolt://localhost:7687"
    user: "neo4j"
    password: ""               # set here or via NEO4J_PASSWORD env; never commit real secrets
    database: "neo4j"
    encrypted: false

# ---- signaling game ----
signaling:
  # sender types: (informed, aligned) priors, expressed as probabilities
  type_priors:
    informed_prior: 0.5        # P(sender is informed)
    aligned_prior: 0.5         # P(sender is aligned with receiver objective)
  # signal cost function parameters: cost = base_cost * cost_scale(sender_type)
  cost:
    cheap_talk_base: 0.02      # near-zero sender cost for commentary/social/media
    costly_base: 2.0           # certified filing revision, enforcement, disclosed position
    informed_cost_mult: 0.4    # informed senders bear lower marginal cost (they know the truth)
    misaligned_cost_mult: 1.0
  # receiver strategy: threshold on posterior credibility
  receiver:
    belief_threshold: 0.6      # credibility above -> treat signal as separating/credible
    precision_prior: 0.8       # reliability receiver assigns to a separating signal
  equilibrium:
    tolerance: 1e-6            # convergence tolerance for equilibrium characterization

# ---- extraction / synthesis ----
extraction:
  retrieval:
    top_k_subgraph: 30         # max nodes in retrieved subgraph
    top_k_passages: 8          # max retrieved evidence passages
  embed:
    backend: tfidf             # tfidf (offline, deterministic) | openai | sentence-transformers
  synthesis:
    llm_backend: mock          # mock is implemented; non-mock values fail fast until a backend is added
    model: ""                  # reserved for a future non-mock backend
    max_tokens: 1200
    temperature: 0.0
    cite_required: true        # uncited claims are dropped / marked low-confidence

# ---- agents: multi-agent signaling-game simulation (agents/*) ----
agents:
  enabled: true
  n_rounds: 5                # reaction rounds after the transmitted-signal corpus
  round_step_days: 3         # reaction timestamp spacing after evaluation.brief_day
  temperature: 0.5           # logit choice noise in the opponent generative model (agents)
  # per-role strategy / information-access / response-time assignment (the 7 roles)
  # strategy: bayes | irl | fictitious_play | heuristic
  # info_access: full (all signals+reactions) | partial (own channels + same-company reactions)
  #               | limited (own channels only, no reactions)
  # response_time: fast (reacts this round) | slow (one-round lag)
  role_defaults:
    insider:    {strategy: irl,              info_access: full,    response_time: fast}
    analyst:    {strategy: bayes,            info_access: partial, response_time: fast}
    competitor: {strategy: fictitious_play,  info_access: partial, response_time: slow}
    supplier:   {strategy: heuristic,        info_access: limited, response_time: slow}
    regulator:  {strategy: bayes,            info_access: full,    response_time: fast}
    journalist: {strategy: heuristic,        info_access: partial, response_time: slow}
    fund:       {strategy: irl,              info_access: full,    response_time: fast}
  # true latent payoff params each agent is tagged with (ground truth for IRL recovery):
  #   theta_truth      weight on acting consistently with own belief (truth-seeking)
  #   theta_contrarian weight on acting opposite to belief (impact-seeking / contrarian)
  #   theta_stay       weight on inaction (cost / reputation avoidance)
  payoff:
    theta_truth_range: [0.5, 2.0]
    theta_contrarian_range: [0.0, 1.5]
    theta_stay_range: [0.0, 2.0]
    temperature: 0.5
  irl:
    grid_truth: [0.5, 1.0, 1.5, 2.0]          # MLE grid over theta_truth
    grid_contrarian: [0.0, 0.5, 1.0, 1.5]     # MLE grid over theta_contrarian
    grid_stay: [0.0, 0.5, 1.0, 1.5, 2.0]      # MLE grid over theta_stay

# ---- evaluation ----
evaluation:
  brief_day: 40               # decision brief produced at day t; uses only data <= t
  outcome_window_days: 30      # brief at t scored against outcomes in (t, t+window]
  price_impact_threshold: 0.02 # |return| above this counts as a realized signal impact
  metrics: [credibility, posterior_confidence, price_impact, citation_coverage]
